plugins {
    id 'java'
}

apply from: 'gradle/portswigger-policy.gradle'

group = 'ninja.burpsuite.extension.sharpener'
version = ''

repositories {
    mavenCentral()
}

// Reviewed versions and publication/security evidence: docs/dependency-review.md
// One shared version so the main and test classpaths cannot drift.
def montoyaApiVersion = '2026.7'

dependencies {
    compileOnly "net.portswigger.burp.extensions:montoya-api:$montoyaApiVersion" //https://central.sonatype.com/artifact/net.portswigger.burp.extensions/montoya-api/
    // the preferences code from Burp-Montoya-Utilities is vendored under libs/thirdparty, see the NOTICE file
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "org.apache.commons:commons-lang3:3.21.0"
    implementation "com.formdev:flatlaf:3.7.2"
    implementation "com.fifesoft:rsyntaxtextarea:4.0.1"
    implementation "org.reflections:reflections:0.10.2" // Unchanged; see maintenance/provenance limits in the review.
    implementation "net.java.dev.jna:jna:5.19.1"

    testImplementation "net.portswigger.burp.extensions:montoya-api:$montoyaApiVersion" // same version as compileOnly above
    testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
    testImplementation "org.mockito:mockito-core:5.24.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

// Acquisition only: downloads the locked inputs without compiling or executing tests.
// Verification stays strict; update locks and verification metadata only after review.
tasks.register('resolveDependencies') {
    doLast {
        configurations.matching { it.canBeResolved }.each { it.resolve() }
    }
}

test {
    useJUnitPlatform()
    systemProperty "java.awt.headless", "true"
}

// Exercise the JDK-only wrapper guard with normal unit tests; never package it.
sourceSets.test.java.srcDir('gradle/bootstrap')

base {
    archivesName = project.name
}

// A fat jar otherwise drops notices with duplicate names (and *.txt exclusions).
// Keep each upstream notice under its artifact's name, alongside missing notices
// reviewed from the matching upstream source in licenses/third-party.
def thirdPartyNotices = tasks.register('thirdPartyNotices', Sync) {
    into layout.buildDirectory.dir('third-party-notices')
    from('licenses/third-party')
    from('docs/third-party-notices.md')
    configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        from(zipTree(artifact.file)) {
            include '**/LICENSE*', '**/NOTICE*', '**/COPYING*', 'LICENSE*', 'NOTICE*', 'COPYING*'
            into "${artifact.name}-${artifact.moduleVersion.id.version}"
        }
    }
}

jar{
    dependsOn thirdPartyNotices
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Preserve FlatLaf's Java 9+ implementations in the combined jar.
    manifest.attributes('Multi-Release': 'true')
    from(thirdPartyNotices) {
        into 'META-INF/third-party'
    }
    // ship the license and the section 7 notice inside the distributed jar
    from(rootDir) {
        include 'LICENSE', 'NOTICE'
        into 'META-INF'
    }
    from {
        (configurations.runtimeClasspath).collect { it.isDirectory() ? it : zipTree(it) }
    }{
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "META-INF/*.txt"
        exclude 'module-info.class', 'META-INF/versions/*/module-info.class'
    }
}

tasks.register('verifyPackagedJar') {
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { packaged ->
            def names = packaged.entries().collect { it.name }
            ['META-INF/LICENSE', 'META-INF/NOTICE', 'extension.properties',
             'META-INF/third-party/third-party-notices.md',
             'org/fife/ui/rsyntaxtextarea/themes/dark.xml'].each { name ->
                if (!names.contains(name)) throw new GradleException("Missing packaged resource: $name")
            }
            if (names.any { it.startsWith('burp/api/') || it.startsWith('org/junit/') ||
                    it.startsWith('.github/') || it == 'gradle/ci-jdk.json' ||
                    it == 'gradle/validation-jdk.json' || it == 'ReviewedGradle.class' ||
                    it.startsWith('ninja/burpsuite/fulluitest/') || it == 'ui-cases.json' ||
                    it.startsWith('org/mockito/') || it.startsWith('net/bytebuddy/') ||
                    it.startsWith('com/google/common/') || it.startsWith('org/fife/ui/autocomplete/') }) {
                throw new GradleException('Host API, test libraries, or removed libraries bundled in extension')
            }
            configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def noticePrefix = "META-INF/third-party/${artifact.name}-${artifact.moduleVersion.id.version}/"
                if (!names.any { it.startsWith(noticePrefix) && !it.endsWith('/') }) {
                    throw new GradleException("Missing third-party notices: ${artifact.id}")
                }
                new java.util.zip.ZipFile(artifact.file).withCloseable { upstream ->
                    upstream.entries().findAll { it.name ==~ /.*\.(dll|so|dylib|jnilib|a)/ }.each { entry ->
                        def bundled = packaged.getEntry(entry.name)
                        if (bundled == null || !Arrays.equals(packaged.getInputStream(bundled).bytes,
                                upstream.getInputStream(entry).bytes)) {
                            throw new GradleException("Missing or altered bundled native: ${entry.name}")
                        }
                    }
                }
            }
        }
    }
}

def verifyToolchainComposition = tasks.register('verifyToolchainComposition') {
        doLast {
            if (gradle.gradleVersion != '9.9.1') throw new GradleException('Use the reviewed wrapper toolchain')
            def pin = new Properties()
            file('gradle/security-toolchain.properties').withInputStream { pin.load(it) }
            def type = Class.forName('com.google.common.collect.HashBiMap', true, gradle.getClass().classLoader)
            def loaded = new File(type.protectionDomain.codeSource.location.toURI())
            def sha = java.security.MessageDigest.getInstance('SHA-256').digest(loaded.bytes).encodeHex().toString()
            if (sha != pin.getProperty('guava.jar.sha256'))
                throw new GradleException('Gradle daemon is using unreviewed or vulnerable Guava; use the checked-in launcher')
            println "Verified Gradle daemon Guava ${pin.getProperty('guava.version')}: $sha"
        }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPackagedJar'), verifyToolchainComposition
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:unchecked"
}

tasks.withType(Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    destinationDirectory = file("$rootDir/releases/")
}

apply from: 'gradle/full-ui-tests.gradle'

