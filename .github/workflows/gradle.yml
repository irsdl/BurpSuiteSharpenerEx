name: Java CI and PortSwigger review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Diagnostic validation only. Publication remains blocked pending the reviewed
# toolchain and manual host evidence in docs/portswigger-review.json.
# Never delete previous releases/tags or publish automatically on push.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (2026-06-02); existing baseline, admission pending
        with:
          persist-credentials: false
      - name: Set up JDK 21 (diagnostic baseline; exact CI admission pending)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0 (2026-01-22)
        with:
          distribution: oracle
          java-version: '21'
      - name: Record runner identity
        run: |
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          java -version
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Acquire locked verified dependencies
        run: ./gradlew resolveDependencies --dependency-verification strict --console=plain
      - name: Build and check PortSwigger push review offline
        run: ./gradlew verifyPushReadiness --offline --dependency-verification strict --console=plain
