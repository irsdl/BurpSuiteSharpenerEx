name: Java CI and PortSwigger review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      jar_sha256:
        description: SHA-256 of the tested Windows jar
        value: ${{ jobs.windows-build.outputs.jar_sha256 }}

# Normal CI is read-only. The separate manual release workflow accepts only
# the recorded maintainer approval and never publishes untrusted PR code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact tested public commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SERVER_URL" == 'https://github.com' ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c credential.helper= -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if configured_hooks=$(git config --get core.hooksPath); then
            test "$configured_hooks" = '.githooks'
          fi
          git config --local core.hooksPath .githooks
      - name: Test pinned JDK acquisition guards
        run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Acquire the exact reviewed security JDK
        run: python3 -I .github/scripts/acquire_ci_jdk.py --destination "$RUNNER_TEMP/sharpener-reviewed-jdk"
      - name: Record runner identity
        run: |
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          git --version
          python3 --version
          java -version
          cat "$JAVA_HOME/release"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Acquire and verify approved Gradle security composition
        run: ./gradlew --sharpener-acquire-toolchain
      - name: Acquire locked verified dependencies
        run: ./gradlew resolveDependencies --dependency-verification strict --console=plain
      - name: Build and check PortSwigger push review offline
        run: ./gradlew verifyPushReadiness --offline --dependency-verification strict --console=plain

  windows-build:
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      jar_sha256: ${{ steps.jar.outputs.sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact tested public commit
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_SERVER_URL -ne 'https://github.com' -or $env:GITHUB_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' -or $env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid checkout identity' }
          git init --quiet .
          git config core.autocrlf false
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Wrong checked-out commit' }
          git config --local core.hooksPath .githooks
      - name: Test JDK and publication guards
        run: python -I -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Acquire exact reviewed Windows JDK
        run: python -I .github/scripts/acquire_ci_jdk.py --destination "$env:RUNNER_TEMP/sharpener-reviewed-jdk"
      - name: Record runner identity
        run: |
          Write-Output "Runner image: $env:ImageOS $env:ImageVersion"
          git --version
          python --version
          gh --version
          java -version
      - name: Acquire approved toolchain
        run: .\gradlew.bat --sharpener-acquire-toolchain
      - name: Acquire locked verified dependencies
        run: .\gradlew.bat resolveDependencies --dependency-verification strict --console=plain
      - name: Build and check review offline
        run: .\gradlew.bat verifyPushReadiness --offline --dependency-verification strict --console=plain
      - name: Check release readiness for explicit release dispatch
        if: github.event_name == 'workflow_dispatch'
        run: .\gradlew.bat verifyReleaseReadiness --offline --dependency-verification strict --console=plain
      - name: Record tested jar hash
        id: jar
        run: |
          $sha = (Get-FileHash releases/BurpSuiteSharpenerEx.jar -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          Write-Output "Tested Windows jar SHA-256: $sha"
